    <meta property="og:title" content="대시보드 — skillar">

    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('skillar-theme') || 'system';
      } catch (error) {
        if (!(error instanceof DOMException)) throw error;
      }
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="/src/style.css">
    <link rel="stylesheet" href="/src/account.css">
    <link rel="stylesheet" href="/src/shell.css">
    <link rel="stylesheet" href="/src/dashboard/dashboard.css">
  </head>
  <body class="app-shell">
    <a class="skip" href="#main">본문으로 건너뛰기</a>
    <header class="shell header app-topbar">
      <a class="wordmark" href="/" aria-label="skillar 홈"><img class="wordmark-light" src="/wordmark-light.svg" width="120" height="24" alt=""><img class="wordmark-dark" src="/wordmark-dark.svg" width="120" height="24" alt=""></a>
      <nav class="app-breadcrumb" aria-label="현재 위치"><details><summary>호스팅</summary><div><a href="/dashboard/">대시보드</a><a href="/skills/">스킬</a><a href="/connections/">연결</a><a href="/login/">계정</a></div></details><span aria-hidden="true">›</span><span data-breadcrumb-item>대시보드</span></nav>
      <button id="app-jump" class="button secondary app-jump" type="button" aria-haspopup="dialog" aria-controls="app-command">이동… <kbd>⌘K</kbd></button>
      <label class="theme-label">테마
        <select id="theme"><option value="system">시스템</option><option value="light">라이트</option><option value="dark">다크</option></select>
      </label>
      <button id="app-menu" class="app-menu" type="button" aria-label="메뉴 열기" aria-controls="app-drawer" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>메뉴</button>
      <aside id="app-navigation" class="app-navigation">
        <nav aria-label="주요 메뉴"><div class="app-nav-group"><span>관찰</span><a href="/dashboard/" aria-current="page">대시보드</a><a href="/dashboard/#/sessions">세션</a></div><div class="app-nav-group"><span>자산</span><a href="/skills/">스킬</a></div><div class="app-nav-group"><span>설정</span><a href="/connections/">연결</a></div></nav>
        <div class="app-account"><nav aria-label="계정 메뉴"><a href="/login/">계정</a></nav><div id="sidebar-account"></div></div>
      </aside>
      <dialog id="app-drawer" class="app-drawer" aria-label="주요 탐색">
        <div class="app-navigation__title"><strong>탐색</strong><button id="app-menu-close" class="app-menu-close" type="button">닫기</button></div>
      </dialog>
    </header>
    <main id="main" class="shell account-main dashboard-page" tabindex="-1">
      <div class="dashboard-heading"><div><h1>대시보드</h1><p class="account-lead">동의한 출처의 세션과 스킬 사용 근거를 확인합니다.</p></div></div>
      <noscript>
        <p class="note">JavaScript가 꺼져 있습니다. 대시보드가 출처를 읽고 활동을 보여 주려면 JavaScript가 필요합니다. 로그인과 로그아웃은 그대로 할 수 있습니다.</p>
        <div class="auth-actions">
          <a class="button primary" href="/auth/google">Google로 계속하기 <span aria-hidden="true">→</span></a>
          <form method="post" action="/auth/logout"><button class="button secondary" type="submit">이 브라우저에서 로그아웃</button></form>
        </div>
      </noscript>
      <div id="dashboard-app"></div>
    </main>
    <footer class="account-footer"><div class="shell cluster"><a class="text-link" href="/">skillar로 돌아가기</a><a class="text-link" href="/connections/">MCP 연결</a></div></footer>
    <script type="module" src="/src/dashboard/main.tsx"></script>
    <script type="module" src="/src/shell.ts"></script>
