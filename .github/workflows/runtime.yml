name: Runtime validation

on:
  push:
    branches: [main, dev, feat/dev-tools-mvp]
    paths: ['server/**', 'worker/**', 'local/**', 'shared/**', 'site/**', 'clients/**', 'plugins/**', '.agents/plugins/**', 'scripts/**', '.github/workflows/**']
  pull_request:
    paths: ['server/**', 'worker/**', 'local/**', 'shared/**', 'site/**', 'clients/**', 'plugins/**', '.agents/plugins/**', 'scripts/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            worker/package-lock.json
            site/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.5"
      - run: bun scripts/verify.mjs

  sidecars:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - runner: macos-latest
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-latest
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.5"
      - run: bun install --frozen-lockfile && bun run build
        working-directory: shared
      - run: bun install --frozen-lockfile
        working-directory: site
      - run: bun install --frozen-lockfile
        working-directory: local
      - run: bun scripts/build-theme.mjs
      - run: bun run build && bun run build:sidecars '${{ matrix.target }}'
        working-directory: local
      - run: bun local/test-sidecar.mjs 'local/dist/sidecars/${{ matrix.target }}/skillar'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skillar-${{ matrix.target }}
          path: local/dist/sidecars/${{ matrix.target }}/skillar
          if-no-files-found: error
